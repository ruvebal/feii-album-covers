      <stop offset="50%" stop-color="#ffae00"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="18" fill="url(#yhl-sky)"/>
  <!-- CRT Scanlines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="24" x2="256" y2="24"/>
    <line x1="0" y1="48" x2="256" y2="48"/>
    <line x1="0" y1="72" x2="256" y2="72"/>
    <line x1="0" y1="96" x2="256" y2="96"/>
    <line x1="0" y1="120" x2="256" y2="120"/>
    <line x1="0" y1="144" x2="256" y2="144"/>
    <line x1="0" y1="168" x2="256" y2="168"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="0" y1="216" x2="256" y2="216"/>
