    <circle cx="-38" cy="16" r="18" stroke="#00f0ff"/>
    <circle cx="36" cy="-8" r="18" stroke="#ff2a85"/>
    <path d="M-38,16 L-6,12 L14,-12 L-16,-10 Z"/>
