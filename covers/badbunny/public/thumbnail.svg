<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="yhl-sky" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1e1348"/>
      <stop offset="55%" stop-color="#0a081c"/>
      <stop offset="100%" stop-color="#03020a"/>
    </radialGradient>
    <radialGradient id="yhl-aura" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yhl-neon" x1="0%" y1="0%" x2="100%" y2="0%">
