<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Rayas lila en diagonal alrededor de una bola cromada con una estela roja y naranja">
	<defs>
		<pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
			<rect width="12" height="12" fill="#241433"/>
			<rect width="12" height="5" fill="#9b7fd0"/>
		</pattern>
		<linearGradient id="shade" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#07030b" stop-opacity="0"/>
			<stop offset="1" stop-color="#07030b" stop-opacity=".8"/>
		</linearGradient>
		<linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ea2530"/>
			<stop offset=".45" stop-color="#f2629b"/>
			<stop offset=".75" stop-color="#ee4d30"/>
			<stop offset="1" stop-color="#f2a531"/>
		</linearGradient>
		<radialGradient id="chrome" cx=".36" cy=".3" r=".8">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset=".2" stop-color="#c9c9d2"/>
			<stop offset=".6" stop-color="#6d6a78"/>
			<stop offset="1" stop-color="#1b1922"/>
		</radialGradient>
	</defs>
	<rect width="256" height="256" fill="url(#stripes)"/>
	<rect width="256" height="256" fill="url(#shade)"/>
	<path d="M0 60 L92 104" fill="none" stroke="#ea2530" stroke-width="3" stroke-linecap="round"/>
	<path d="M120 128 C150 140 150 168 176 176 S214 206 256 216" fill="none" stroke="url(#trail)" stroke-width="12" stroke-linecap="round"/>
	<circle cx="108" cy="112" r="30" fill="url(#chrome)"/>
	<rect x="5" y="5" width="246" height="246" rx="6" fill="none" stroke="#1c0d26" stroke-width="10"/>
</svg>
